spring.config.activate.on-profile=dev

# ===================================
# DATABASE CONFIGURATION (DEV)
# ===================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crmdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:crmuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:crmpass123}

# ===================================
# JPA/HIBERNATE (DEV)
# ===================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================
# JWT CONFIGURATION (DEV)
# ===================================
# WARNING: This is a development-only secret. DO NOT USE IN PRODUCTION!
jwt.secret=${JWT_SECRET:dGVzdC1zZWNyZXQtZm9yLWRldmVsb3BtZW50LW9ubHktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9u}
jwt.expirationMs=${JWT_EXPIRATION:86400000}

# ===================================
# MAIL CONFIGURATION (DEV)
# ===================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@example.com}
spring.mail.password=${MAIL_PASSWORD:changeme}

# ===================================
# LOGGING (DEV)
# ===================================
logging.level.org.springframework=INFO
logging.level.org.hibernate=DEBUG
logging.level.liquibase=DEBUG

# ===================================
# AI CONFIGURATION (DEV)
# Set feature.ai.enabled=true and provide a valid API key to activate.
# Default provider: OpenAI (spring-ai-starter-model-openai). To switch,
# change the starter in pom.xml and replace the spring.ai.openai.* block.
# ===================================
feature.ai.enabled=${AI_ENABLED:false}

# -- OpenAI (default) --
spring.ai.openai.api-key=${OPENAI_API_KEY:disabled}
spring.ai.openai.chat.options.model=${AI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.7

# -- Anthropic (alternative) --
# spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
# spring.ai.anthropic.chat.options.model=claude-3-5-haiku-20241022


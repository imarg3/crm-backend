spring.config.activate.on-profile=dev

# Postgres datasource config
spring.datasource.url=jdbc:postgresql://localhost:5430/bluetick
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Development JWT Configuration (DO NOT USE IN PRODUCTION)
jwt.secret=${JWT_SECRET:dGVzdC1zZWNyZXQtZm9yLWRldmVsb3BtZW50LW9ubHktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9u}
jwt.expirationMs=${JWT_EXPIRATION:86400000}

# Liquibase Configuration - Use crm schema consistently
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
spring.liquibase.default-schema=crm
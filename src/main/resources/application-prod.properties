spring.config.activate.on-profile=prod

# ===================================
# DATABASE CONFIGURATION (PROD)
# ===================================
# Required environment variables: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://dpg-cjnk7othe99c73ehu9a0-a:5432/bluetick}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Connection pool settings for production
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===================================
# JPA/HIBERNATE (PROD)
# ===================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===================================
# JWT CONFIGURATION (PROD)
# ===================================
# REQUIRED: Must be set via environment variable
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION:3600000}

# ===================================
# MAIL CONFIGURATION (PROD)
# ===================================
# Required environment variables: MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# ===================================
# LOGGING (PROD)
# ===================================
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.liquibase=INFO
logging.level.org.code.bluetick=INFO

# ===================================
# SECURITY (PROD)
# ===================================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
spring.application.name=crm-api

# Database Configuration - MOVED to profile-specific files
# See: application-dev.properties and application-prod.properties
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration (common across all environments)
spring.jpa.properties.hibernate.default_schema=crm
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=none

# Liquibase Configuration (common across all environments)
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=crm
spring.liquibase.enabled=true

# Logging is configured in logback-spring.xml

springdoc.api-docs.path=/api-docs
springdoc.show-actuator=true
springdoc.swagger-ui.path=/swagger-ui-custom.html

management.endpoints.web.exposure.include=health, info
management.info.env.enabled=true

info.app.name=CRM application
info.app.description=CRM application
info.app.version=1.0.0

crm.greeting=Hello

# AI Feature Flag (disabled by default — enable per profile with a valid API key)
feature.ai.enabled=false
# Placeholder keeps Spring AI's startup validation happy when AI is disabled.
# The real key must be set via OPENAI_API_KEY env var when feature.ai.enabled=true.
spring.ai.openai.api-key=${OPENAI_API_KEY:disabled}

# Java 21 Virtual Threads (improves concurrency for I/O operations)
spring.threads.virtual.enabled=true

# Mail Configuration - Common SMTP settings
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Mail credentials moved to profile-specific files

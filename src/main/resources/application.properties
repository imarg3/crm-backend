spring.application.name=bluetick-crm-api

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=crm
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Let Liquibase handle schema management # other options: validate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Liquibase Configuration
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=crm

# JWT Configuration - Use environment variables for production
jwt.secret=${JWT_SECRET:dGVzdC1zZWNyZXQtZm9yLWRldmVsb3BtZW50LW9ubHktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9u}
jwt.expirationMs=${JWT_EXPIRATION:86400000}

# Logging is configured in logback-spring.xml

springdoc.api-docs.path=/api-docs
springdoc.show-actuator=true
springdoc.swagger-ui.path=/swagger-ui-custom.html

management.endpoints.web.exposure.include=health, info
management.info.env.enabled=true

info.app.name=CRM application
info.app.description=CRM application
info.app.version=1.0.0

crm.greeting=Hello

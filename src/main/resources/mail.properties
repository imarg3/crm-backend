# Mail Configuration
# Configure these values for production email functionality

mail.host=${MAIL_HOST:smtp.gmail.com}
mail.port=${MAIL_PORT:587}
mail.username=${MAIL_USERNAME:noreply@example.com}
mail.password=${MAIL_PASSWORD:changeme}
mail.transport.protocol=smtp
mail.properties.mail.smtp.auth=true
mail.properties.smtp-starttls-enable=true
mail.properties.mail.smtp.ssl.trust=*
